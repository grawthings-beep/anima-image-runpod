<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Anima Manga Composer</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Cloudflare Pages tool</p>
        <h1>Anima Manga Composer</h1>
      </div>
      <div class="topbar-actions">
        <label class="file-button" for="importJsonInput">JSON読込</label>
        <button id="saveJsonButton" type="button">JSON保存</button>
        <button id="exportButton" type="button" class="primary">PNG書出</button>
      </div>
    </header>

    <main class="app-shell">
      <aside class="side-panel tools-panel" aria-label="tools">
        <section>
          <h2>ページ</h2>
          <label class="field">
            <span>サイズ</span>
            <select id="pagePreset">
              <option value="portrait">縦ページ 1080 x 1520</option>
              <option value="square">正方形 1200 x 1200</option>
              <option value="webtoon">縦長 1080 x 1920</option>
            </select>
          </label>
          <label class="file-button full" for="backgroundInput">背景画像</label>
          <button id="clearBackgroundButton" type="button" class="secondary">背景クリア</button>
        </section>

        <section>
          <h2>追加</h2>
          <div class="tool-grid">
            <button id="addPanelButton" type="button">コマ</button>
            <button id="addBubbleButton" type="button">吹き出し</button>
            <button id="addDialogButton" type="button">文字</button>
            <button id="addSfxButton" type="button">効果音</button>
          </div>
        </section>

        <section>
          <h2>レイヤー</h2>
          <div id="layerList" class="layer-list" aria-live="polite"></div>
          <div class="layer-actions">
            <button id="moveUpButton" type="button" class="secondary">上へ</button>
            <button id="moveDownButton" type="button" class="secondary">下へ</button>
            <button id="deleteButton" type="button" class="danger">削除</button>
          </div>
        </section>

        <section>
          <h2>テンプレート</h2>
          <button id="demoButton" type="button" class="secondary full">サンプル配置</button>
          <button id="blankButton" type="button" class="secondary full">白紙に戻す</button>
        </section>
      </aside>

      <section class="stage-panel" aria-label="canvas stage">
        <div class="stage-meta">
          <span id="pageSizeLabel">1080 x 1520</span>
          <span>ドラッグで移動、右下ハンドルで拡縮</span>
        </div>
        <div class="canvas-frame">
          <canvas id="pageCanvas" width="1080" height="1520"></canvas>
        </div>
      </section>

      <aside class="side-panel inspector-panel" aria-label="inspector">
        <section>
          <h2>選択中</h2>
          <p id="selectionLabel" class="selection-label">未選択</p>
        </section>

        <section id="imageSection">
          <h2>画像</h2>
          <label class="file-button full" for="panelImageInput">選択コマに画像</label>
          <label class="field">
            <span>フィット</span>
            <select id="fitInput">
              <option value="cover">cover</option>
              <option value="contain">contain</option>
            </select>
          </label>
        </section>

        <section>
          <h2>位置</h2>
          <div class="number-grid">
            <label class="field"><span>X</span><input id="xInput" type="number" step="1"></label>
            <label class="field"><span>Y</span><input id="yInput" type="number" step="1"></label>
            <label class="field"><span>幅</span><input id="wInput" type="number" step="1"></label>
            <label class="field"><span>高</span><input id="hInput" type="number" step="1"></label>
          </div>
        </section>

        <section id="textSection">
          <h2>文字</h2>
          <label class="field">
            <span>内容</span>
            <textarea id="textInput" rows="4"></textarea>
          </label>
          <label class="field">
            <span>プリセット</span>
            <select id="presetInput">
              <option value="clean">標準</option>
              <option value="impact">太い効果音</option>
              <option value="whisper">小声</option>
              <option value="shake">震え</option>
              <option value="dark">黒ベタ抜き</option>
            </select>
          </label>
          <div class="number-grid">
            <label class="field"><span>文字</span><input id="fontSizeInput" type="number" min="8" max="220" step="1"></label>
            <label class="field"><span>回転</span><input id="rotationInput" type="number" min="-180" max="180" step="1"></label>
            <label class="field"><span>フチ</span><input id="strokeWidthInput" type="number" min="0" max="40" step="1"></label>
            <label class="field check-field"><input id="verticalInput" type="checkbox"><span>縦書き</span></label>
          </div>
          <div class="color-grid">
            <label class="field"><span>塗り</span><input id="fillInput" type="color"></label>
            <label class="field"><span>フチ</span><input id="strokeInput" type="color"></label>
          </div>
        </section>

        <section id="bubbleSection">
          <h2>吹き出し</h2>
          <div class="color-grid">
            <label class="field"><span>面</span><input id="bubbleFillInput" type="color"></label>
            <label class="field"><span>線</span><input id="bubbleStrokeInput" type="color"></label>
          </div>
          <p class="hint">吹き出しの尻尾は小さい丸ハンドルで動かせます。</p>
        </section>
      </aside>
    </main>

    <input id="backgroundInput" type="file" accept="image/*" hidden>
    <input id="panelImageInput" type="file" accept="image/*" hidden>
    <input id="importJsonInput" type="file" accept="application/json,.json" hidden>
    <script src="./app.js"></script>
  </body>
</html>
